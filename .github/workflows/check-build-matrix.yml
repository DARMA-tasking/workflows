name: Check generated CI matrices

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Verify generated CI matrices are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyYAML
      - name: Generate CI matrices
        run: python ci/build-matrix.py
      - name: Check generated files are up to date
        run: git diff --exit-code -- ci/shared/matrix/azure.json ci/shared/matrix/github.json
